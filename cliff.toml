# git-cliff 配置文件
# 文档：https://docs.git-cliff.org/

[changelog]
# changelog header
header = """
# 更新日志 / Changelog\n
本项目遵循 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/) 格式
（中文为主、英文并存，与 README 策略一致）。\n
"""
# template for the changelog body
# https://docs.git-cliff.org/templates/body/
body = """
{%- macro remote_url() -%}
  https://github.com/linkcccp/tgdl-bot
{%- endmacro -%}
{% for commit in commits %}
  {% if commit.version %}
    ## [{{ commit.version }}] - {{ commit.timestamp | date(format="%Y-%m-%d") }}
  {% else %}
    ## [Unreleased]
  {% endif %}

  {% if commit.github %}
  > 由 [{{ commit.github.pr }}]({{ self::remote_url() }}/pull/{{ commit.github.pr }}) 合并
  {% endif %}

  {% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | striptags | trim | upper_first }}
  {% for commit in commits %}
    - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
      {{ commit.message | upper_first }}\
      {% if commit.github.pr %} ([#{{ commit.github.pr }}]({{ self::remote_url() }}/pull/{{ commit.github.pr }})){% endif %}\
      {% if commit.github.contributors is not empty %}
      \n
      {% for contributor in commit.github.contributors %}
        &nbsp;&nbsp;- @{{ contributor }}
      {% endfor %}
      {% endif %}\
      {% if commit.footers is not empty %}
      {% for footer in commit.footers %}
        \n  > {{ footer }}
      {% endfor %}
      {% endif %}\
      {% if commit.github.issue is not empty %}
      \n  > closes {% for issue in commit.github.issue %}[#{{ issue }}]({{ self::remote_url() }}/issues/{{ issue }}){% if not loop.last %}, {% endif %}{% endfor %}
      {% endif %}

  {% endfor %}
{% endfor %}

"""
# remove the leading and trailing whitespace from the template
trim = true
# changelog footer
footer = """
---
**Full Changelog**: https://github.com/linkcccp/tgdl-bot/compare/{{ previous.tag }}...{{ version }}

<!-- Generated by https://git-cliff.org -->
"""
# postprocessors for the changelog
postprocessors = [
  # remove version numbers from the header
  { pattern = '^\#.*\n', replace = "" },
]

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# process only conventional commits
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for parsing and grouping commits
commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^doc", group = "📚 Documentation" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🔨 Refactor" },
  { message = "^style", group = "🎨 Styling" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^build", group = "📦 Build" },
  { message = "^ci", group = "🔧 CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^revert", group = "⏪ Revert" },
  { message = ".*", group = "🔍 Other Changes" },
]
# filter out the commits that match `skip`
protect_breaking_changes = false
# exclude the commit that match `skip`
disable_links = false
# replace the tag with the new tag
replace_tags = false
# map of tag patterns to their replacement
tag_map = {}
# regex for matching the remote URL
remote_url = "https://github.com/linkcccp/tgdl-bot"
# regex for matching the issue number
# 支持：closes #123, fixes #123, resolves #123, #123（直接引用）
issue_parsers = [
  { regex = "(?:closes|fixes|resolves)\\s+#(\\d+)", group = "issue" },
  { regex = "\\b#(\\d+)\\b", group = "issue" },
]
# regex for matching the PR number
# 支持：(#123)（merge commit 格式）、#123（直接引用）、PR #123
pr_parsers = [
  { regex = "\\(#(\\d+)\\)", group = "pr" },
  { regex = "PR\\s+#(\\d+)", group = "pr" },
]
# regex for matching the contributors
contributors_parsers = []
# regex for matching the body of the commit
body_parsers = []
# regex for matching the scope
scope_parsers = []
# regex for matching the version
version_parsers = []
# regex for matching the tag
tag_parsers = []
# regex for matching the header
header_parsers = []
# regex for matching the footer
footer_parsers = []
# regex for matching the date
date_parsers = []
# regex for matching the time
time_parsers = []
# regex for matching the timezone
timezone_parsers = []
# regex for matching the user
user_parsers = []
# regex for matching the email
email_parsers = []
# regex for matching the hash
hash_parsers = []
# regex for matching the short hash
short_hash_parsers = []
# regex for matching the long hash
long_hash_parsers = []
# regex for matching the author
author_parsers = []
# regex for matching the committer
committer_parsers = []
# regex for matching the committer date
committer_date_parsers = []
# regex for matching the committer time
committer_time_parsers = []
# regex for matching the committer timezone
committer_timezone_parsers = []
# regex for matching the committer email
committer_email_parsers = []
# regex for matching the committer user
committer_user_parsers = []
# regex for matching the author date
author_date_parsers = []
# regex for matching the author time
author_time_parsers = []
# regex for matching the author timezone
author_timezone_parsers = []
# regex for matching the author email
author_email_parsers = []
# regex for matching the author user
author_user_parsers = []
