name: CI

# PR/推送校验 CI：任何开发分支的推送与面向 main/dev 的 PR 都需通过
# 构建（0 警告硬门槛）与测试，保证合并前质量。
on:
  push:
    branches:
      - dev
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
  pull_request:
    branches:
      - main
      - dev

# 权限最小化：CI 只读仓库内容，构建与测试不产生任何外部写入。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 恢复 NuGet 依赖
      - name: Restore
        run: dotnet restore

      # 0 警告是硬门槛（GenerateDocumentationFile 已开启，public 成员缺
      # XML 注释会报警告）：构建输出写入 build.log，出现任何 warning 即失败。
      - name: Build (Release, 0 warnings gate)
        shell: bash
        run: |
          set -euo pipefail
          dotnet build -c Release 2>&1 | tee build.log
          if grep -E "warning" build.log; then
            echo "::error::构建存在警告（0 警告是硬门槛），请修复后重新推送"
            exit 1
          fi

      # 正常执行全部单元测试（真实网络/yt-dlp 的集成测试不可用时静默跳过）
      - name: Test
        run: dotnet test

  # PR 标题格式校验：自动发版（auto-version workflow）依赖 PR 标题类型前缀计算
  # SemVer 版本号，格式不合规的标题会导致版本类型误判，因此合并前必须校验。
  # Dependabot 的 PR（标题 "Bump xxx from a to b"）跳过校验，自动版本逻辑按 chore 处理。
  pr-title-check:
    name: PR 标题格式校验（SemVer 发版依据）
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title prefix
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR 标题: $TITLE"
          if ! echo "$TITLE" | grep -qE '^(feat|fix|breaking|chore|docs)(\([^)]+\))?!?: '; then
            echo "::error::PR 标题必须以类型前缀开头：breaking: / feat: / fix: / chore: / docs:（如 'feat: 支持 xxx'）——自动发版依赖标题类型"
            exit 1
          fi