name: Release

on:
  push:
    tags:
      - 'v*'

# 需要写权限以创建 Release 与推送 GHCR 包。
# 另请在仓库 Settings -> Actions -> General -> Workflow permissions 选择
# "Read and write permissions"，否则 Release 创建 / GHCR 推送会失败。
permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (含子项目 telegram-bot-api)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build telegram-bot-api (子项目，Debian 12 容器内编译以兼容 Debian 12 glibc)
        shell: bash
        run: |
          set -euo pipefail
          # 必须在 Debian 12 容器内编译：ubuntu-latest (glibc 2.39) 产出的二进制
          # 会依赖 GLIBC_2.38+，无法在 Debian 12 (glibc 2.36) 上运行。
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace/third_party/telegram-bot-api \
            debian:12 bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq build-essential cmake gperf git libssl-dev zlib1g-dev pkg-config
              mkdir -p build
              cd build
              cmake -DCMAKE_BUILD_TYPE=Release ..
              cmake --build . -j"$(nproc)"
              test -x ./telegram-bot-api
            '
          echo "built telegram-bot-api: $(ls -la third_party/telegram-bot-api/build/telegram-bot-api | awk '{print $5}') bytes"

      - name: Publish (linux-x64 self-contained single file)
        run: |
          dotnet publish src/TGBot/TGBot.csproj -c Release -r linux-x64 \
            --self-contained true -p:PublishSingleFile=true \
            -o "$RUNNER_TEMP/publish"

      - name: Download yt-dlp & ffmpeg (静态版)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker/dist
          curl -fsSL --retry 3 -o docker/dist/yt-dlp \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp"
          chmod +x docker/dist/yt-dlp
          curl -fsSL --retry 3 -A "Mozilla/5.0" -o /tmp/ff.tar.xz \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff
          cp "$(find /tmp/ff -name ffmpeg -type f | head -n1)" docker/dist/ffmpeg
          chmod +x docker/dist/ffmpeg
          echo "yt-dlp=$(./docker/dist/yt-dlp --version)" "ffmpeg=$(./docker/dist/ffmpeg -version | head -n1 | grep -oE 'version [^ ]+' | head -n1)"

      - name: Stage docker build context
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          cp "$RUNNER_TEMP/publish/tgdl-bot" docker/dist/tgdl-bot
          cp third_party/telegram-bot-api/build/telegram-bot-api docker/dist/telegram-bot-api
          echo "VERSION=${VER}" >> "$GITHUB_ENV"
          ls -la docker/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/linkcccp/tgdl-bot:${{ env.VERSION }}
            ghcr.io/linkcccp/tgdl-bot:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            已发布 Docker 镜像：`ghcr.io/linkcccp/tgdl-bot:${{ env.VERSION }}`（及 `:latest`）

            一键部署：
            ```bash
            curl -fsSL https://raw.githubusercontent.com/linkcccp/tgdl-bot/main/scripts/install.sh | sudo bash
            ```
