name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# 防止快速连续打 tag 导致 release 并发执行；已开始的 release 不取消
concurrency:
  group: release
  cancel-in-progress: false

# 需要写权限以创建 Release 与推送 GHCR 包。
# 权限已通过下方 permissions 显式声明（contents: write + packages: write）。
# GitHub 规则：workflow 内的显式声明会覆盖仓库默认的 Workflow permissions
# 设置，因此仓库默认保持 "Read repository contents and packages permissions"
# （read-only）即可，无需修改仓库设置。
permissions:
  contents: write
  packages: write

jobs:
  check:
    name: Check release conditions
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check if tag push triggered CI
        id: check
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # 检查 CI 是否由 tag push 触发（通过 env 传入，避免 shell 注入）
          if [[ "$HEAD_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
            echo "version=${HEAD_BRANCH#v}" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
  # 双架构构建：matrix 按 distarch（自命名 x64/arm64）拆两个 job。
  #   x64   -> ubuntu-latest（x86_64 原生 runner），platform 标准串 linux/amd64（amd64 即 x64）
  #   arm64 -> ubuntu-24.04-arm（GitHub 官方免费 ARM 原生 runner，public 仓库可用），
  #            platform 标准串 linux/arm64
  # 各 job 下载对应架构资产、publish 对应 RID、构建并推 per-arch tag（{ver}-x64 / {ver}-arm64）；
  # fail-fast: false 使两 job 互不阻塞（per-arch tag 天然隔离），multi-arch 合并由 manifest job 收口。
  build:
    name: Build (${{ matrix.distarch }})
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distarch: x64                  # 自命名（dist 目录/per-arch tag），统一 x64
            platform: linux/amd64          # Docker 标准平台串（buildx 硬性要求，amd64 即 x64）
            runs-on: ubuntu-latest
            dotnet-rid: linux-x64
            tba-asset: telegram-bot-api-linux-x64
            ffmpeg-url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz  # BtbN 命名 linux64（对应 x64）
            ytdlp-asset: yt-dlp            # 官方 x86_64 命名资产（即 x64）
          - distarch: arm64                # 自命名
            platform: linux/arm64          # Docker 标准平台串
            runs-on: ubuntu-24.04-arm      # GitHub 官方免费 ARM 原生 runner
            dotnet-rid: linux-arm64
            tba-asset: telegram-bot-api-linux-arm64
            ffmpeg-url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz  # BtbN 命名 linuxarm64（对应 arm64）
            ytdlp-asset: yt-dlp_linux_aarch64  # 官方 aarch64 命名资产
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: bash
        run: |
          echo "VERSION=${{ needs.check.outputs.version }}" >> "$GITHUB_ENV"

      # telegram-bot-api 预编译二进制来自 fork（linkcccp/telegram-bot-api）：
      # fork 由 auto-sync 工作流自动同步上游并构建发布到其 Release。
      # 资产按架构区分（官方命名 telegram-bot-api-linux-x64 / -linux-arm64）；
      # 资产缺失（404）或 ELF 校验失败重试后仍失败 -> exit 1 硬失败，不静默降级到另一架构。
      - name: Download telegram-bot-api (fork latest 预编译, ${{ matrix.distarch }})
        shell: bash
        run: |
          set -euo pipefail
          TBA_REPO="${TBA_REPO:-linkcccp/telegram-bot-api}"
          asset="${{ matrix.tba-asset }}"
          JSON="$(curl -fsSL --retry 3 "https://api.github.com/repos/${TBA_REPO}/releases/latest")"
          url="$(printf '%s' "$JSON" | jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .browser_download_url' | head -n1)"
          [[ -n "$url" ]] || { echo "错误：${TBA_REPO} latest Release 缺少资产 ${asset}"; exit 1; }
          mkdir -p "docker/dist/${{ matrix.distarch }}"
          ok=0
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 3 -o "docker/dist/${{ matrix.distarch }}/telegram-bot-api" "$url" || { sleep 5; continue; }
            if [[ "$(head -c4 "docker/dist/${{ matrix.distarch }}/telegram-bot-api" 2>/dev/null | od -An -tx1 | tr -d ' \n')" == "7f454c46" ]]; then ok=1; break; fi
            rm -f "docker/dist/${{ matrix.distarch }}/telegram-bot-api"; sleep 5
          done
          [[ "$ok" -eq 1 ]] || { echo "错误：${asset} 下载校验失败（非 ELF）"; exit 1; }
          chmod +x "docker/dist/${{ matrix.distarch }}/telegram-bot-api"
          echo "${asset}: $(stat -c%s "docker/dist/${{ matrix.distarch }}/telegram-bot-api") bytes"

      # 版本号由 Resolve version 步骤写入 GITHUB_ENV；传给 publish 使其
      # 写入程序集/文件版本（后续镜像与 Release 均基于该版本号）。
      - name: Publish (${{ matrix.dotnet-rid }})
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "docker/dist/${{ matrix.distarch }}"
          dotnet publish TGBot/TGBot.csproj -c Release -r "${{ matrix.dotnet-rid }}" --self-contained true -p:PublishSingleFile=true -p:Version=${VERSION} -o "$RUNNER_TEMP/publish/${{ matrix.distarch }}"
          cp "$RUNNER_TEMP/publish/${{ matrix.distarch }}/tgdl-bot" "docker/dist/${{ matrix.distarch }}/tgdl-bot"

      - name: Download ffmpeg (静态 ${{ matrix.distarch }})
        shell: bash
        run: |
          set -euo pipefail
          url="${{ matrix.ffmpeg-url }}"  # BtbN/FFmpeg-Builds 命名：x64 -> linux64、arm64 -> linuxarm64；tarball 内为 ffmpeg-master-*/bin/ffmpeg
          # 校验 xz 魔数并重试，防止瞬时坏响应（200 但内容错误时 curl 不会自动重试）
          ok=0
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 3 -A "Mozilla/5.0" -o /tmp/ff.tar.xz "$url" || { sleep 5; continue; }
            if [[ "$(head -c6 /tmp/ff.tar.xz 2>/dev/null | od -An -tx1 | tr -d ' \n')" == "fd377a585a00" ]]; then ok=1; break; fi
            rm -f /tmp/ff.tar.xz; sleep 5
          done
          [[ "$ok" -eq 1 ]] || { echo "错误：ffmpeg 下载校验失败（非 xz）"; exit 1; }
          rm -rf /tmp/ff; mkdir -p /tmp/ff
          tar -xf /tmp/ff.tar.xz -C /tmp/ff
          mkdir -p "docker/dist/${{ matrix.distarch }}"
          FF="$(find /tmp/ff -name ffmpeg -type f | head -n1)"
          [[ -n "$FF" && -f "$FF" ]] || { echo "错误：ffmpeg 解压产物缺失"; exit 1; }
          cp "$FF" "docker/dist/${{ matrix.distarch }}/ffmpeg"
          chmod +x "docker/dist/${{ matrix.distarch }}/ffmpeg"
          # 原生执行校验（arm64 job 上即为 arm64 二进制真实验证）
          "docker/dist/${{ matrix.distarch }}/ffmpeg" -version >/dev/null 2>&1 || { echo "错误：ffmpeg 不可执行"; exit 1; }
          echo "ffmpeg: $("docker/dist/${{ matrix.distarch }}/ffmpeg" -version 2>/dev/null | head -n1)"

      - name: Download yt-dlp (${{ matrix.distarch }})
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ matrix.ytdlp-asset }}"  # 官方命名：x64 为 yt-dlp（x86_64），arm64 为 yt-dlp_linux_aarch64
          mkdir -p "docker/dist/${{ matrix.distarch }}"
          ok=0
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 3 -o "docker/dist/${{ matrix.distarch }}/yt-dlp" \
              "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${asset}" || { sleep 5; continue; }
            chmod +x "docker/dist/${{ matrix.distarch }}/yt-dlp"
            if "docker/dist/${{ matrix.distarch }}/yt-dlp" --version >/dev/null 2>&1; then ok=1; break; fi
            rm -f "docker/dist/${{ matrix.distarch }}/yt-dlp"; sleep 5
          done
          [[ "$ok" -eq 1 ]] || { echo "错误：yt-dlp 下载校验失败"; exit 1; }
          echo "yt-dlp: $("docker/dist/${{ matrix.distarch }}/yt-dlp" --version)"

      - name: Verify dist artifacts complete (${{ matrix.distarch }})
        shell: bash
        run: |
          set -euo pipefail
          ls -l "docker/dist/${{ matrix.distarch }}/"
          for f in tgdl-bot telegram-bot-api ffmpeg yt-dlp; do
            [[ -f "docker/dist/${{ matrix.distarch }}/$f" ]] || { echo "错误：缺少 $f"; exit 1; }
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只推 per-arch tag（{ver}-x64 / {ver}-arm64），不推 latest/裸版本号，
      # 避免两 job 竞争同一 tag；multi-arch 合并由 manifest job 收口。
      # build-args 仅显式传 DISTARCH（自命名，buildx 不自动注入，值为 matrix.distarch）；
      # TARGETARCH 由 buildx 按 platforms 自动注入标准值（amd64/arm64），无需也不应显式传。
      - name: Build & push image (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/linkcccp/tgdl-bot:${{ needs.check.outputs.version }}-${{ matrix.distarch }}
          build-args: |
            DISTARCH=${{ matrix.distarch }}

      # 运行时冒烟仅 x64 job 做（arm64 镜像无法在 x64 runner 上执行；QEMU 模拟不做，
      # arm64 真实运行由用户 ARM 设备实测）。检查镜像内 deno/yt-dlp/ffmpeg 版本可执行。
      - name: Verify image (deno JS runtime) [x64 only]
        if: matrix.distarch == 'x64'
        shell: bash
        run: |
          docker run --rm --entrypoint bash "ghcr.io/linkcccp/tgdl-bot:${{ needs.check.outputs.version }}-${{ matrix.distarch }}" -c '
            set -e
            deno --version >/dev/null
            /opt/tgdl-bot/seed-bin/yt-dlp --version >/dev/null
            /opt/tgdl-bot/seed-bin/ffmpeg -version >/dev/null
            echo "deno/ffmpeg/yt-dlp OK"
          '

  # manifest 收口：合并两 per-arch tag 为 multi-arch {ver} 与 latest，
  # 断言双平台后创建 GitHub Release（只在此 job 建一次）。
  manifest:
    name: Merge manifest & create Release
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 需要完整历史来生成 changelog

      - name: Resolve version
        shell: bash
        run: |
          echo "VERSION=${{ needs.check.outputs.version }}" >> "$GITHUB_ENV"
          echo "TAG=${{ needs.check.outputs.tag }}" >> "$GITHUB_ENV"

      # 获取前一个 tag，用于生成 changelog 范围和 Full Changelog 链接
      - name: Get previous tag
        id: prev_tag
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 2 | tail -n 1)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "前一个 tag: ${PREV_TAG}"

      # 生成 changelog（纯 git log，无第三方依赖）
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          TAG="${TAG}"
          REPO_URL="https://github.com/linkcccp/tgdl-bot"

          # 生成 changelog 内容
          {
            echo "## [${TAG}] - $(date +%Y-%m-%d)"
            echo ""
            git log "${PREV_TAG}..${TAG}" --format="- %s" --no-merges
          } > CHANGELOG_RELEASE.md

          # 读取生成的 changelog
          CHANGELOG=$(cat CHANGELOG_RELEASE.md)
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # 更新 CHANGELOG.md
      - name: Update CHANGELOG.md
        shell: bash
        run: |
          # 生成新的 changelog 内容
          {
            echo "# 更新日志 / Changelog"
            echo ""
            echo "本项目遵循 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/) 格式"
            echo "（中文为主、英文并存，与 README 策略一致）。"
            echo "**版本号与 git tag 一一对应**：每个发布版本对应一个 \`v*\` tag"
            echo "（如 \`v2.4.0\`），tag 触发 CI 构建镜像并创建 GitHub Release。"
            echo ""
            echo "This project follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/)"
            echo "format (Chinese-primary with English, same policy as the README)."
            echo "**Every version maps to a git tag** (e.g. \`v2.4.0\`); pushing the tag triggers CI"
            echo "to build the Docker image and create a GitHub Release."
            echo ""
          } > CHANGELOG.md
          
          # 追加生成的 changelog 内容
          cat CHANGELOG_RELEASE.md >> CHANGELOG.md
          
          # 追加历史版本部分
          {
            echo ""
            echo "## 历史版本 / Previous Releases"
            echo ""
            echo "较早版本（v2.3.1 及更早）无独立更新日志，变更内容见对应 git tag 与"
            echo "[GitHub Releases](https://github.com/linkcccp/tgdl-bot/releases)。"
            echo ""
            echo "Earlier releases (v2.3.1 and before) do not have a dedicated changelog; see the"
            echo "corresponding git tags and [GitHub Releases](https://github.com/linkcccp/tgdl-bot/releases)。"
          } >> CHANGELOG.md

      # imagetools 需要 buildx；GHCR 登录凭据 job 间不共享，manifest job 内需重新登录
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 合并 per-arch tag -> multi-arch manifest（{ver} 与 latest 一次建两个）
      - name: Merge multi-arch manifest (${{ needs.check.outputs.version }} + latest)
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/linkcccp/tgdl-bot:${VERSION}" \
            -t "ghcr.io/linkcccp/tgdl-bot:latest" \
            "ghcr.io/linkcccp/tgdl-bot:${VERSION}-x64" \
            "ghcr.io/linkcccp/tgdl-bot:${VERSION}-arm64"

      # 断言 manifest 同时包含两个标准平台串（amd64 即 x64），防合并遗漏；失败即 job 失败
      - name: Assert manifest contains linux/amd64 + linux/arm64
        shell: bash
        run: |
          set -euo pipefail
          out="$(docker buildx imagetools inspect "ghcr.io/linkcccp/tgdl-bot:${VERSION}")"
          printf '%s\n' "$out"
          grep -q "linux/amd64" <<<"$out" || { echo "错误：manifest 缺少 linux/amd64（即 x64）"; exit 1; }
          grep -q "linux/arm64" <<<"$out" || { echo "错误：manifest 缺少 linux/arm64"; exit 1; }

      # 更新 CHANGELOG.md 到仓库
      - name: Commit CHANGELOG.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${VERSION}" || echo "No changes to commit"
          git push origin HEAD:main

      # 使用生成的 changelog 创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Release ${{ needs.check.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.changelog }}
            
            ---
            
            **Full Changelog**: https://github.com/linkcccp/tgdl-bot/compare/${{ steps.prev_tag.outputs.prev_tag }}...${{ needs.check.outputs.tag }}
            
            已发布 Docker 镜像：`ghcr.io/linkcccp/tgdl-bot:${{ needs.check.outputs.version }}`（及 `:latest`）
            平台：linux/amd64（即 x64）+ linux/arm64（multi-arch manifest，`docker pull` 自动按宿主架构拉取）

            一键部署：
            ```bash
            curl -fsSL https://raw.githubusercontent.com/linkcccp/tgdl-bot/main/scripts/install.sh | sudo bash
            ```

            说明：arm64 镜像经原生 arm64 runner 构建并完成资产原生执行校验，构建侧已验证；
            真实运行待 ARM 设备实测。armv7/32 位不支持。

  # API 文档部署到 GitHub Pages；与 manifest 并行（仅等 check + build）
  deploy-docs:
    name: Deploy API docs to GitHub Pages
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write  # actions/deploy-pages 所需 OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}  # 确保文档构建自 tag 对应的代码

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install docfx
        run: dotnet tool install --global docfx

      - name: Build docs
        run: dotnet run --project TGBot.Docfx

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: TGBot.Docfx/_site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4