name: Release

on:
  push:
    tags:
      - 'v*'

# 需要写权限以创建 Release。
# 另请在仓库 Settings -> Actions -> General -> Workflow permissions 选择
# "Read and write permissions"，否则 Release 创建会失败。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (含子项目 telegram-bot-api)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build telegram-bot-api (子项目，Debian 12 容器内编译以兼容 Debian 12 glibc)
        shell: bash
        run: |
          set -euo pipefail
          # 必须在 Debian 12 容器内编译：ubuntu-latest (glibc 2.39) 产出的二进制
          # 会依赖 GLIBC_2.38+，无法在 Debian 12 (glibc 2.36) 上运行。
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace/third_party/telegram-bot-api \
            debian:12 bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq build-essential cmake gperf git libssl-dev zlib1g-dev pkg-config
              mkdir -p build
              cd build
              cmake -DCMAKE_BUILD_TYPE=Release ..
              cmake --build . -j"$(nproc)"
              test -x ./telegram-bot-api
            '
          echo "built telegram-bot-api: $(ls -la third_party/telegram-bot-api/build/telegram-bot-api | awk '{print $5}') bytes"

      - name: Publish (linux-x64 self-contained single file)
        run: |
          dotnet publish src/TGBot/TGBot.csproj -c Release -r linux-x64 \
            --self-contained true -p:PublishSingleFile=true \
            -o "$RUNNER_TEMP/publish"

      - name: Package tarball + bare binary
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "tag=${TAG} version=${VER}"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          cp "$RUNNER_TEMP/publish/tgdl-bot" "$STAGE/"
          cp third_party/telegram-bot-api/build/telegram-bot-api "$STAGE/telegram-bot-api"
          cp -r deploy "$STAGE/"
          cp README.md "$STAGE/"
          tar -C "$STAGE" -czf "$RUNNER_TEMP/tgdl-bot-${VER}-linux-x64.tar.gz" .
          cp "$RUNNER_TEMP/publish/tgdl-bot" "$RUNNER_TEMP/tgdl-bot-linux-x64"
          echo "VERSION=${VER}" >> "$GITHUB_ENV"
          echo "ASSET_TARBALL=$RUNNER_TEMP/tgdl-bot-${VER}-linux-x64.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_BINARY=$RUNNER_TEMP/tgdl-bot-linux-x64" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.ASSET_TARBALL }}
            ${{ env.ASSET_BINARY }}
