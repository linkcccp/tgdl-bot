name: Release

on:
  push:
    tags:
      - 'v*'

# 需要写权限以创建 Release 与推送 GHCR 包。
# 另请在仓库 Settings -> Actions -> General -> Workflow permissions 选择
# "Read and write permissions"，否则 Release 创建 / GHCR 推送会失败。
permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # telegram-bot-api 预编译二进制来自 fork（linkcccp/telegram-bot-api）：
      # fork 由 auto-sync 工作流自动同步上游并构建 x64/arm64 发布到其 Release。
      # 下载后校验 ELF 魔数并重试，防止瞬时坏响应。
      - name: Download telegram-bot-api (fork latest 预编译)
        shell: bash
        run: |
          set -euo pipefail
          TBA_REPO="${TBA_REPO:-linkcccp/telegram-bot-api}"
          echo "TBA_REPO=${TBA_REPO}"
          JSON="$(curl -fsSL --retry 3 "https://api.github.com/repos/${TBA_REPO}/releases/latest")"
          for pair in "amd64:telegram-bot-api-linux-x64" "arm64:telegram-bot-api-linux-arm64"; do
            arch="${pair%%:*}"; asset="${pair##*:}"
            url="$(printf '%s' "$JSON" | jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .browser_download_url' | head -n1)"
            [[ -n "$url" ]] || { echo "错误：${TBA_REPO} latest Release 缺少资产 ${asset}"; exit 1; }
            mkdir -p "docker/dist/${arch}"
            ok=0
            for i in 1 2 3 4 5; do
              curl -fsSL --retry 3 -o "docker/dist/${arch}/telegram-bot-api" "$url" || { sleep 5; continue; }
              if [[ "$(head -c4 "docker/dist/${arch}/telegram-bot-api" 2>/dev/null | od -An -tx1 | tr -d ' \n')" == "7f454c46" ]]; then ok=1; break; fi
              rm -f "docker/dist/${arch}/telegram-bot-api"; sleep 5
            done
            [[ "$ok" -eq 1 ]] || { echo "错误：${asset} 下载校验失败（非 ELF）"; exit 1; }
            chmod +x "docker/dist/${arch}/telegram-bot-api"
            echo "${asset}: $(stat -c%s "docker/dist/${arch}/telegram-bot-api") bytes"
          done

      - name: Publish (linux-x64 + linux-arm64)
        run: |
          set -euo pipefail
          dotnet publish src/TGBot/TGBot.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o "$RUNNER_TEMP/publish/x64"
          dotnet publish src/TGBot/TGBot.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -o "$RUNNER_TEMP/publish/arm64"
          mkdir -p docker/dist/amd64 docker/dist/arm64
          cp "$RUNNER_TEMP/publish/x64/tgdl-bot" docker/dist/amd64/tgdl-bot
          cp "$RUNNER_TEMP/publish/arm64/tgdl-bot" docker/dist/arm64/tgdl-bot

      - name: Download ffmpeg (静态, x64 + arm64)
        shell: bash
        run: |
          set -euo pipefail
          for pair in "amd64:amd64" "arm64:arm64"; do
            arch="${pair%%:*}"; jv="${pair##*:}"
            url="https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-${jv}-static.tar.xz"
            # 校验 xz 魔数并重试，防止瞬时坏响应（200 但内容错误时 curl 不会自动重试）
            ok=0
            for i in 1 2 3 4 5; do
              curl -fsSL --retry 3 -A "Mozilla/5.0" -o "/tmp/ff-${arch}.tar.xz" "$url" || { sleep 5; continue; }
              if [[ "$(head -c6 "/tmp/ff-${arch}.tar.xz" 2>/dev/null | od -An -tx1 | tr -d ' \n')" == "fd377a585a00" ]]; then ok=1; break; fi
              rm -f "/tmp/ff-${arch}.tar.xz"; sleep 5
            done
            [[ "$ok" -eq 1 ]] || { echo "错误：ffmpeg ${arch} 下载校验失败（非 xz）"; exit 1; }
            rm -rf "/tmp/ff-${arch}"; mkdir -p "/tmp/ff-${arch}"
            tar -xf "/tmp/ff-${arch}.tar.xz" -C "/tmp/ff-${arch}"
            mkdir -p "docker/dist/${arch}"
            FF="$(find "/tmp/ff-${arch}" -name ffmpeg -type f | head -n1)"
            [[ -n "$FF" && -f "$FF" ]] || { echo "错误：ffmpeg ${arch} 解压产物缺失"; exit 1; }
            cp "$FF" "docker/dist/${arch}/ffmpeg"
            chmod +x "docker/dist/${arch}/ffmpeg"
            docker/dist/${arch}/ffmpeg -version >/dev/null 2>&1 || { echo "错误：ffmpeg ${arch} 不可执行"; exit 1; }
            echo "ffmpeg(${arch}): $(docker/dist/${arch}/ffmpeg -version 2>/dev/null | head -n1)"
          done

      - name: Download yt-dlp (跨架构通用)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker/dist
          ok=0
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 3 -o docker/dist/yt-dlp \
              "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" || { sleep 5; continue; }
            chmod +x docker/dist/yt-dlp
            if docker/dist/yt-dlp --version >/dev/null 2>&1; then ok=1; break; fi
            rm -f docker/dist/yt-dlp; sleep 5
          done
          [[ "$ok" -eq 1 ]] || { echo "错误：yt-dlp 下载校验失败"; exit 1; }
          echo "yt-dlp: $(docker/dist/yt-dlp --version)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (arm64 模拟)
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/linkcccp/tgdl-bot:${{ env.VERSION }}
            ghcr.io/linkcccp/tgdl-bot:latest

      - name: Verify image (deno JS runtime)
        shell: bash
        run: |
          docker run --rm --entrypoint bash "ghcr.io/linkcccp/tgdl-bot:${{ env.VERSION }}" -c '
            set -e
            deno --version >/dev/null
            /opt/tgdl-bot/seed-bin/yt-dlp --version >/dev/null
            echo "deno JS runtime OK"
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            已发布多架构 Docker 镜像：`ghcr.io/linkcccp/tgdl-bot:${{ env.VERSION }}`（及 `:latest`）
            平台：linux/amd64、linux/arm64

            一键部署：
            ```bash
            curl -fsSL https://raw.githubusercontent.com/linkcccp/tgdl-bot/main/scripts/install.sh | sudo bash
            ```
