name: Release

on:
  push:
    tags:
      - 'v*'

# 需要写权限以创建 Release。
# 另请在仓库 Settings -> Actions -> General -> Workflow permissions 选择
# "Read and write permissions"，否则 Release 创建会失败。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (linux-x64 self-contained single file)
        run: |
          dotnet publish src/TGBot/TGBot.csproj -c Release -r linux-x64 \
            --self-contained true -p:PublishSingleFile=true \
            -o "$RUNNER_TEMP/publish"

      - name: Package tarball + bare binary
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "tag=${TAG} version=${VER}"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          cp "$RUNNER_TEMP/publish/tgdl-bot" "$STAGE/"
          cp -r deploy "$STAGE/"
          cp README.md "$STAGE/"
          tar -C "$STAGE" -czf "$RUNNER_TEMP/tgdl-bot-${VER}-linux-x64.tar.gz" .
          cp "$RUNNER_TEMP/publish/tgdl-bot" "$RUNNER_TEMP/tgdl-bot-linux-x64"
          echo "VERSION=${VER}" >> "$GITHUB_ENV"
          echo "ASSET_TARBALL=$RUNNER_TEMP/tgdl-bot-${VER}-linux-x64.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_BINARY=$RUNNER_TEMP/tgdl-bot-linux-x64" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.ASSET_TARBALL }}
            ${{ env.ASSET_BINARY }}
