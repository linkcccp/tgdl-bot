name: auto-version

# PR 合并进 main 后，按 PR 标题类型自动计算下一个 SemVer 版本号并打 tag；
# tag push（refs/tags/v*）自然触发 release.yml 完成镜像构建与发布，实现全自动发版。
# 无关联 PR 的 push（如维护者本地 dev→main 大版本合并后直接 push）跳过，
# 大版本号由维护者手动打 tag（无类型信息，无法自动判定）。
#
# 版本规则（从最新 tag vX.Y.Z 递增）：
#   breaking: / feat!: / feat(scope)!:  -> major（X+1.0.0）
#   feat: / feat(scope):                -> minor（X.(Y+1).0）
#   fix: / chore:（含 scope 形式）       -> patch（X.Y.(Z+1)）
#   docs:                               -> 不发版（跳过打 tag）
#   Dependabot "Bump xxx from a to b"   -> 按 chore: 处理（patch）
on:
  push:
    branches: [main]
  workflow_dispatch: {}    # 手动触发用（debug/补跑）

# 防并发竞态：两个 PR 连续合并时排队处理，避免都读到旧 tag 打出重复版本号。
# cancel-in-progress: false —— 已开始的 job 必须跑完（打 tag 是持久副作用，不可取消重来）。
concurrency:
  group: auto-version
  cancel-in-progress: false

permissions:
  contents: write          # 打 tag 并 push 需要写权限

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # 全历史，确保能读到所有 tag

      # 1) 找本次 push 关联的已合并 PR，解析类型（SemVer 递增依据）。
      #    类型识别用正则而非字符串包含（feat: 不误判 feature；支持 scope 形式）；
      #    常规前缀 + `!`（conventional commits breaking 标记）一律按 breaking。
      - uses: actions/github-script@v9
        id: prinfo
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha
            });
            const merged = pulls.find(p => p.merged_at && p.merge_commit_sha === context.sha);
            if (!merged) {
              console.log('no merged PR for this push — skip (manual big-version merge)');
              core.setOutput('skip', 'true');
              return;
            }
            const title = merged.title || '';
            // 识别类型：breaking:/feat:/fix:/chore:/docs:（含 scope 形式），
            // 常规前缀 + `!` = breaking（如 feat!:、feat(scope)!:、breaking!:），
            // Dependabot "Bump ..."（无前缀）视为 chore。
            let type = 'chore';
            const m = title.match(/^(breaking|feat|fix|chore|docs)(\([^)]*\))?(!)?(\s|:)/);
            if (m) {
              type = (m[1] === 'breaking' || m[3] === '!') ? 'breaking' : m[1];
            } else if (/^Bump\s/.test(title) || /^dependabot/i.test(title)) {
              type = 'chore';
            }
            console.log(`PR #${merged.number}: "${title}" -> type=${type}`);
            core.setOutput('skip', type === 'docs' ? 'true' : 'false');
            core.setOutput('type', type);

      # 2) 计算新版本号：取最新 vX.Y.Z tag，按类型递增。
      #    sort -V 是版本感知排序（v2.10.0 > v2.9.0，避免字符串排序问题）。
      - name: Compute next version
        id: ver
        if: steps.prinfo.outputs.skip != 'true'
        run: |
          LATEST=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then echo "no version tag found — start at 0.0.0"; LATEST="v0.0.0"; fi
          VER="${LATEST#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          TYPE="${{ steps.prinfo.outputs.type }}"
          case "$TYPE" in
            breaking) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            feat)     MINOR=$((MINOR+1)); PATCH=0 ;;
            *)        PATCH=$((PATCH+1)) ;;   # fix / chore
          esac
          echo "NEW=v${MAJOR}.${MINOR}.${PATCH}"
          echo "NEW=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      # 3) 打 tag + push（push tag 触发 release.yml 发版）。
      #    checkout 已注入 GITHUB_TOKEN 凭据，push 直接可用。
      - name: Create and push tag
        if: steps.prinfo.outputs.skip != 'true'
        run: |
          git tag "${{ steps.ver.outputs.NEW }}"
          git push origin "${{ steps.ver.outputs.NEW }}"
          echo "released ${{ steps.ver.outputs.NEW }}"