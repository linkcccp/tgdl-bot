services:
  tgdl-bot:
    image: ghcr.io/linkcccp/tgdl-bot:latest
    container_name: tgdl-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - tgdl-data:/opt/tgdl-bot/api-data
      - tgdl-tmp:/var/lib/tgdl-bot/tmp
      - tgdl-bin:/opt/tgdl-bot/bin
      - tgdl-cookies:/opt/tgdl-bot/cookies
    # 可选：内存限制（默认不设，容器整体约 150-250MB）
    # mem_limit: 512m

volumes:
  tgdl-data:
  tgdl-tmp:
  tgdl-bin:
  tgdl-cookies:
