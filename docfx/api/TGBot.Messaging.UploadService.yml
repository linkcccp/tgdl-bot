  summary: 将一组媒体上传到所有目标会话（同一任务可能含多个产物，如 flac+mp3）。
  example: []
  syntax:
    content: public Task<UploadResult> UploadAsync(IReadOnlyList<DownloadedMedia> media, IReadOnlyList<long> targetChatIds, long? requesterChatId, CancellationToken cancellationToken)
    parameters:
    - id: media
      type: System.Collections.Generic.IReadOnlyList{TGBot.Download.DownloadedMedia}
      description: 下载产物列表。
    - id: targetChatIds
      type: System.Collections.Generic.IReadOnlyList{System.Int64}
      description: 目标会话 ID 列表。
    - id: requesterChatId
      type: System.Nullable{System.Int64}
      description: 请求者会话 ID（私聊，可空）。
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: 取消令牌。
    return:
      type: System.Threading.Tasks.Task{TGBot.Messaging.UploadResult}
      description: 上传结果。
