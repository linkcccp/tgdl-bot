  summary: 启动长轮询并阻塞，直到被取消。
  example: []
  syntax:
    content: Task RunLongPollingAsync(Func<InboundMessage, CancellationToken, Task> onUpdate, Func<Exception, CancellationToken, Task> onPollError, CancellationToken cancellationToken)
    parameters:
    - id: onUpdate
      type: System.Func{TGBot.Messaging.InboundMessage,System.Threading.CancellationToken,System.Threading.Tasks.Task}
      description: 处理单条入站消息。
    - id: onPollError
      type: System.Func{System.Exception,System.Threading.CancellationToken,System.Threading.Tasks.Task}
      description: 轮询错误的回调（不抛出则继续轮询）。
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: 取消令牌。
    return:
      type: System.Threading.Tasks.Task
      description: 轮询正常退出时完成。
    content.vb: Function RunLongPollingAsync(onUpdate As Func(Of InboundMessage, CancellationToken, Task), onPollError As Func(Of Exception, CancellationToken, Task), cancellationToken As CancellationToken) As Task
