  assemblies:
  - tgdl-bot
  namespace: TGBot.Config
  summary: >-
    config.conf 解析器。


    <p>格式：每行 <code>键 = 值</code>，支持 <code>#</code>/<code>;</code> 注释、空行与 <code>[section]</code> 段头。

    解析失败抛出 <xref href="TGBot.Config.ConfigParseException" data-throw-if-not-resolved="false"></xref>，消息为**中英双行并列**（启动期无用户上下文，双行最稳妥）。</p>

    <p>值校验单点：<xref href="TGBot.Config.ConfigParser.ValidateValue(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref>，/config set 与启动解析共用，禁止在其他模块重复实现规则。</p>
