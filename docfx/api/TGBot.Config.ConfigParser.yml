  summary: >-
    安装配置锁键：不允许经 /config 或 overlay 修改。


    <p>含 StateDir：状态目录（languages/overlay/pending-notify）不应由 bot 远程改动，

    避免配置与状态目录分裂（overlay 自身始终以 config.conf 推导的目录读取）。</p>
