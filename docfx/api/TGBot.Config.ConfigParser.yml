  summary: >-
    取配置生效值的可读字符串（/config list 展示用；空值返回空串，由调用方决定占位显示）。


    <p>敏感键脱敏：<code>LocalApiBaseUrl</code> 的 userinfo 与查询串凭据、<code>YtDlpProxy</code> 的 userinfo

