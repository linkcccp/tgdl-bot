  summary: >-
    负责定位并读取 config.conf。


    <p>查找顺序：<code>--config &lt;path&gt;</code> 参数 → 环境变量 <code>TGDL_CONFIG</code> →

    与程序二进制同目录 → 当前工作目录。若仍找不到则抛出 <xref href="TGBot.Config.ConfigLoadException" data-throw-if-not-resolved="false"></xref>。

    错误消息为中英双行并列（启动期无用户上下文）。</p>
