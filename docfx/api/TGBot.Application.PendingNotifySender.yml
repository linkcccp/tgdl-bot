  summary: >-
    启动期消费 pending-notify：认领（rename .sending 防重复）→ 按存储语言渲染并发送 →

    成功删除 / 失败递增计数待下次启动重试（上限后丢弃）。


    <p>发送时机：BotService 就绪后、开始轮询前，由 <xref href="TGBot.Application.BotService" data-throw-if-not-resolved="false"></xref> 调用一次。</p>
