  assemblies:
  - tgdl-bot
  namespace: TGBot.Texts
  summary: >-
    面向 Telegram 用户的文案**资源键**容器（中英双语，实际文案见 <code>Texts/I18n/Resources</code>）。


    <p>i18n 迁移后本类仅承载键名常量（消除魔法字符串）；实际文案由

    <xref href="TGBot.Texts.I18n.II18n.Get(System.String%2cSystem.String%2cSystem.Object%5b%5d)" data-throw-if-not-resolved="false"></xref> 按消息语言渲染，键缺失回退 en，再缺失回退键名本身。</p>

    <p>所有文案均不含内部实现细节（堆栈、路径、配置值等），遵循零信任原则。</p>
