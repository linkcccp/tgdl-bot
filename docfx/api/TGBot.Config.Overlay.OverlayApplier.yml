  summary: 应用配置覆盖，返回新配置实例（未覆盖项与 <code class="paramref">baseConfig</code> 相同）。
  example: []
  syntax:
    content: public static AppConfig Apply(AppConfig baseConfig, IReadOnlyDictionary<string, string> overlay, out IReadOnlyList<string> warnings)
    parameters:
    - id: baseConfig
      type: TGBot.Config.AppConfig
      description: 基础配置（config.conf 解析结果）。
    - id: overlay
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.String}
      description: 覆盖条目（键 → 字符串值，键可为别名）。
    - id: warnings
      type: System.Collections.Generic.IReadOnlyList{System.String}
      description: 被跳过的条目说明（未知键 / 锁键 / 非法值）。
    return:
      type: TGBot.Config.AppConfig
      description: 覆盖后的新配置。
