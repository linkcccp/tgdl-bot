  assemblies:
  - tgdl-bot
  namespace: TGBot.Update
  summary: >-
    ffmpeg autobuild 版本 marker 文件读写。


    <p>BtbN master 二进制的 <code>ffmpeg -version</code> 输出 git 提交计数（如 <code>N-118503</code>），

    与远端的 autobuild 日期版本（如 <code>2026.08.17.13.29.26</code>）标度不同，无法直接比较；

    更新成功后把安装的 autobuild 时间写入 <code>&lt;installPath&gt;.autobuild</code>，

    比较时优先读 marker 保持同标度，"已是最新"短路语义不变。</p>
