  summary: >-
    规范化后的应用版本（如 <code>2.4.0</code>）。


    <p>截断 <code>+commit</code> 后缀（SourceLink/确定性构建注入的 commit 信息）与可选 <code>v</code>

    前缀，仅保留主版本；异常输入回退 <xref href="TGBot.Application.AppInfo.FallbackVersion" data-throw-if-not-resolved="false"></xref>，绝不抛异常。</p>
