  summary: 将 <code>AssemblyInformationalVersion</code> 原始值规范化为展示版本号。
  example: []
  syntax:
    content: public static string Normalize(string? informationalVersion)
    parameters:
    - id: informationalVersion
      type: System.String
      description: 原始信息性版本（可为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>）。
    return:
      type: System.String
      description: >-
        截断 <code>+</code> 后缀、剥离 <code>v</code> 前缀并去除首尾空白后的版本；
            空值/全后缀等异常输入返回 <xref href="TGBot.Application.AppInfo.FallbackVersion" data-throw-if-not-resolved="false"></xref>。
