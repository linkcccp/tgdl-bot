  summary: >-
    应用自身版本信息的稳定读取入口（来源：<code>AssemblyInformationalVersion</code>，自动跟随 csproj

    <code>Version</code> 属性）。


    <p>发布版本由 CI 从 git tag（<code>vX.Y.Z</code>）剥离 <code>v</code> 后经

    <code>dotnet publish -p:Version=X.Y.Z</code> 注入；本地构建使用 csproj 默认值 2.4.0。</p>
