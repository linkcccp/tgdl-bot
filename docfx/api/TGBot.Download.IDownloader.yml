  assemblies:
  - tgdl-bot
  namespace: TGBot.Download
  summary: 执行一次下载。
  example: []
  syntax:
    content: Task<DownloadedMedia> DownloadAsync(DownloadOptions options, Action<DownloadProgress>? progress, CancellationToken cancellationToken)
    parameters:
    - id: options
      type: TGBot.Download.DownloadOptions
      description: 下载参数。
    - id: progress
      type: System.Action{TGBot.Download.DownloadProgress}
      description: 进度回调，可为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>。
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: 取消令牌。
    return:
      type: System.Threading.Tasks.Task{TGBot.Download.DownloadedMedia}
      description: 下载结果。
    content.vb: Function DownloadAsync(options As DownloadOptions, progress As Action(Of DownloadProgress), cancellationToken As CancellationToken) As Task(Of DownloadedMedia)
