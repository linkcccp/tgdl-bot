  assemblies:
  - tgdl-bot
  namespace: TGBot.Download
  summary: 仅音频下载：下载该站最高音质音频，并用 ffmpeg 转出两份（flac 无损 + mp3@320k）。
  example: []
  syntax:
    content: Task<IReadOnlyList<DownloadedMedia>> DownloadAudioBundleAsync(DownloadOptions options, Action<DownloadProgress>? progress, CancellationToken cancellationToken)
    parameters:
    - id: options
      type: TGBot.Download.DownloadOptions
      description: 下载参数（需含 <xref href="TGBot.Download.DownloadOptions.FfmpegPath" data-throw-if-not-resolved="false"></xref>）。
    - id: progress
      type: System.Action{TGBot.Download.DownloadProgress}
      description: 进度回调，可为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>。
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: 取消令牌。
    return:
      type: System.Threading.Tasks.Task{System.Collections.Generic.IReadOnlyList{TGBot.Download.DownloadedMedia}}
      description: 两个媒体（flac、mp3）。
    content.vb: Function DownloadAudioBundleAsync(options As DownloadOptions, progress As Action(Of DownloadProgress), cancellationToken As CancellationToken) As Task(Of IReadOnlyList(Of DownloadedMedia))
  overload: TGBot.Download.IDownloader.DownloadAudioBundleAsync*
  exceptions:
  - type: TGBot.Download.DownloadException
    commentId: T:TGBot.Download.DownloadException
    description: 下载或转码失败时抛出。
  nameWithType.vb: IDownloader.DownloadAudioBundleAsync(DownloadOptions, Action(Of DownloadProgress), CancellationToken)
  fullName.vb: TGBot.Download.IDownloader.DownloadAudioBundleAsync(TGBot.Download.DownloadOptions, System.Action(Of TGBot.Download.DownloadProgress), System.Threading.CancellationToken)
  name.vb: DownloadAudioBundleAsync(DownloadOptions, Action(Of DownloadProgress), CancellationToken)
