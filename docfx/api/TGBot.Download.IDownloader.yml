  assemblies:
  - tgdl-bot
  namespace: TGBot.Download
  summary: 探测并返回「最高画质视频 + 最高音质音频」的 <code>-f</code> 表达式（不下载）。
  example: []
  syntax:
    content: Task<string?> ProbeBestFormatAsync(DownloadOptions options, CancellationToken cancellationToken)
    parameters:
    - id: options
      type: TGBot.Download.DownloadOptions
      description: 探测参数（复用 URL/cookies/代理/额外参数等）。
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: 取消令牌。
    return:
      type: System.Threading.Tasks.Task{System.String}
      description: 格式表达式（如 <code>137+140</code>）；无法挑选时返回 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>。
    content.vb: Function ProbeBestFormatAsync(options As DownloadOptions, cancellationToken As CancellationToken) As Task(Of String)
  overload: TGBot.Download.IDownloader.ProbeBestFormatAsync*
