  name: ParseGitHubApiPublishedAt(string?)
  nameWithType: UriVersionParser.ParseGitHubApiPublishedAt(string?)
  fullName: TGBot.Update.UriVersionParser.ParseGitHubApiPublishedAt(string?)
  type: Method
  source:
    remote:
      path: src/TGBot/Update/UriVersionParser.cs
      branch: main
      repo: ssh://git@ssh.github.com:443/linkcccp/tgdl-bot.git
    id: ParseGitHubApiPublishedAt
    path: ../src/TGBot/Update/UriVersionParser.cs
    startLine: 37
  assemblies:
  - tgdl-bot
  namespace: TGBot.Update
  summary: >-
    从 GitHub API 的 release 响应 JSON 中解析 <code>published_at</code> 字段，

    如 <code>"published_at": "2026-08-17T13:29:26Z"</code> → <code>2026.08.17.13.29.26</code>。


    <p>用于 BtbN/FFmpeg-Builds 的滚动 <code>latest</code> release：其 <code>tag_name</code> 恒为

    <code>latest</code> 不含日期，版本标识只能取 ISO 8601 UTC 的 <code>published_at</code>（单调递增）。</p>
  example: []
  syntax:
    content: public static ToolVersion? ParseGitHubApiPublishedAt(string? json)
    parameters:
    - id: json
      type: System.String
      description: GitHub API 响应 JSON。
    return:
      type: TGBot.Update.ToolVersion
      description: 归一化后的 autobuild 版本；解析失败返回 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>。
    content.vb: Public Shared Function ParseGitHubApiPublishedAt(json As String) As ToolVersion
  overload: TGBot.Update.UriVersionParser.ParseGitHubApiPublishedAt*
