- uid: TGBot.Update.UriVersionParser.ParseGitHubApiPublishedAt(System.String)
  commentId: M:TGBot.Update.UriVersionParser.ParseGitHubApiPublishedAt(System.String)
  id: ParseGitHubApiPublishedAt(System.String)
