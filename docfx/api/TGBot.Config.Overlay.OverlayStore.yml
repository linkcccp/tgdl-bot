  assemblies:
  - tgdl-bot
  namespace: TGBot.Config.Overlay
  summary: >-
    overlay 持久化存储：<code>StateDir/config-overlay.json</code>（键 → 字符串值）与

    <code>StateDir/access-overlay.json</code>（bot 白名单追加列表）。


    <p>与安装配置（config.conf）物理隔离、互不覆盖；原子写（临时文件 + rename）+ 锁保证并发安全；

    两文件分开存储避免互锁。entrypoint 不触碰这些文件，tgdl-data 卷持久，pull 重建不丢。</p>
