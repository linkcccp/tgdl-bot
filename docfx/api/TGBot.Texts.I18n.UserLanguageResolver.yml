  assemblies:
  - tgdl-bot
  namespace: TGBot.Texts.I18n
  summary: >-
    用户语言解析器：按设计文档 §2.3 的解析链（高→低）决定消息语言：


    <ol><li>私聊用户显式选择（<xref href="TGBot.Texts.I18n.UserLanguageStore" data-throw-if-not-resolved="false"></xref>）。</li><li>Telegram <code>language_code</code> 前缀映射（经 <xref href="TGBot.Texts.I18n.LanguageCatalog.NormalizeLanguageCode(System.String)" data-throw-if-not-resolved="false"></xref>）。</li><li>全局默认语言（<code>auto</code> 时跳过本步）。</li><li>内建 fallback：<code>en</code>。</li></ol>


    群组/频道消息不查用户存储，直接走全局默认 → fallback。
  example: []
  syntax:
    content: public sealed class UserLanguageResolver
    content.vb: Public NotInheritable Class UserLanguageResolver
