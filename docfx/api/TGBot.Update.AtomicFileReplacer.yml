  assemblies:
  - tgdl-bot
  namespace: TGBot.Update
  summary: >-
    用新文件原子替换目标文件。


    <p>流程：备份旧文件 → 移动新文件到目标 → 设置权限 → 校验 → 成功删除备份 / 失败恢复备份。</p>
  example: []
  syntax:
    content: public static string Replace(string targetPath, string newFilePath)
    parameters:
    - id: targetPath
      type: System.String
      description: 目标文件路径。
    - id: newFilePath
      type: System.String
      description: 新文件路径（须与目标同一文件系统）。
    return:
      type: System.String
      description: 替换后的目标路径。
    content.vb: Public Shared Function Replace(targetPath As String, newFilePath As String) As String
