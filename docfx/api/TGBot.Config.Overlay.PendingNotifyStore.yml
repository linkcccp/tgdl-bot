    startLine: 31
  assemblies:
  - tgdl-bot
  namespace: TGBot.Config.Overlay
  summary: >-
    重启通知存储：<code>StateDir/pending-notify.json</code>。


    <p>防重复：启动期先 rename 为 <code>.sending</code>（原子认领，进程崩溃也不重发）再发送，

    成功后删除；失败保留并递增 <xref href="TGBot.Config.Overlay.PendingNotifyStore.MaxAttempts" data-throw-if-not-resolved="false"></xref>，超过上限丢弃并记录日志。</p>

    <p>写入为同步原子写（临时文件 + rename）——调用方必须保证在进程退出前完成（设计遗留问题 5）。</p>
  example: []
  syntax:
