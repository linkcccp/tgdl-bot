  summary: >-
    ffmpeg 官方静态构建源（johnvansickle.com）。


    <p>选择理由：官方维护的静态构建，无需 root 权限即可安装到非 root 运行目录、

    支持原子替换与回滚，且版本通常领先 Debian apt 仓库；apt 需要 root 且版本较旧。</p>
